# ------------------------------------------------------------
#  書き方
#  ・グループ（課題代表者・分担研究者）ごとに、代表者の情報と
#    「members:」（研究参加者）を書きます。参加者の人数は自由です（0人なら members: ごと省略可）
#  ・photo: は public/images/members/ に写真を置いて /images/members/ファイル名 と書きます。
#    省略するとシルエットが表示されます
#  ・研究参加者の affiliation（所属）・position（職位）は省略できます
#  ※「氏名（仮）」は写真・氏名がそろうまでの仮置きです
# ------------------------------------------------------------

# 課題代表者
leader:
  name: 德久 淳師
  affiliation: 理化学研究所 計算科学研究センター
  position: 上級研究員
  role: 課題代表者／研究開発の統括
  photo: /images/leader-tokuhisa.jpg
  members:
    - name: 氏名（仮）
    - name: 氏名（仮）
    - name: 氏名（仮）

