# ============================================================
#  サイト全体の設定
#  ※ 「キー: 値」の形で書きます。コロンの後ろには半角スペースが必要です。
# ============================================================

# 検索エンジンに載せない（内部共有中は true のまま。正式公開時に false）
noindex: true

# 英語版を公開するときは true にする
englishEnabled: false

# メインビジュアルの画像（public/images/ に置いたファイル）
heroImage: /images/hero-fugaku.jpg

# 英語略称（ヘッダー・タブ名に表示）
abbr: ACE-SEP

# ------------------------------------------------------------
#  日本語
# ------------------------------------------------------------
ja:
  # 正式課題名。\n の位置でメインビジュアルの改行が入ります
  title: "次世代創薬を拓く\n実験・計算・AI融合型構造アンサンブル基盤"
  # 略称（ヘッダーに「ACE-SEP｜略称」と表示）
  shortTitle: 創薬構造アンサンブル基盤
  # メインビジュアルで課題名に添える表記（英語表記）
  subtitle: AI, Computation and Experiment–Integrated Structural Ensemble Platform
  program: 次世代計算科学グランドリーチプログラム
  lead: 富岳NEXTを見据え、国際的に普及するソフトウェア群と連動する実験・計算・AI融合型の構造アンサンブル解析基盤を開発・普及し、高分解能な多状態構造群と物性値に基づき、構造多様性を考慮した次世代創薬を拓きます。
  period: 2026年度 – 2030年度
  organization: 課題代表機関：理化学研究所 計算科学研究センター
  # メニュー（上から順に表示。key は変更しないでください）
  nav:
    - key: greeting
      label: 挨拶
      heading: 課題代表者挨拶   # ページの見出し（省略するとメニュー名と同じ）
      sub: GREETING
      description: 課題代表者からのご挨拶
    - key: overview
      label: 研究概要
      sub: OVERVIEW
      description: 本課題の背景・目的と研究開発の3本柱
    - key: members
      label: 研究体制
      sub: MEMBERS
      description: 代表者・研究参加者と連携機関
    - key: outreach
      label: 広報・アウトリーチ
      sub: OUTREACH
      description: シンポジウム・講演・メディア掲載など
    - key: news
      label: ニュース
      sub: NEWS
      description: お知らせ一覧

